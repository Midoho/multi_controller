<!DOCTYPE html>
<html lang="ja">
<head>  
<meta name="robots" content="noindex, nofollow">
<title>Smart Servo Controller</title>
<meta charset="utf-8" />
<link rel ="icon" type="image/png" href="img/favicon.ico"> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body spellcheck="false">

<h1>Smart Servo Controller</h1>

<div id="main-container">
  <div id="control-panel">
    <div style="text-align: center; margin-bottom: 20px;">
      <button id="connect" style="padding: 12px 24px; background:#4CAF50; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;">
        Arduinoに接続
      </button>
      <button id="disconnect" style="display: none; padding: 12px 24px; background:#F44336; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;">
        デバイスから切断
      </button>
    </div>

    <div class="box2">
      <h3>RAW値設定プログラム</h3>
      
      <div class="formula-help">
        <p style="margin:0 0 5px 0;"><strong>📝 ミッション:</strong><br>
          変数 <code>val1</code> と <code>val2</code> にモータの生の値（RAW値: 0〜4095）を代入して、ロボットアームを動かしてみよう。<br>
          ※2048がモータの中心位置です。
        </p>
      </div>

      <!-- 元のtextarea（CodeMirrorによって自動的に高機能エディタに置き換わります） -->
      <textarea id="rawScript">
// 変数定義
let val1;
let val2;

// 目標とするRAW値を代入（0〜4095）
val1 = 2048;
val2 = 2048;

// 実行結果としてRAW値を返す
return {
  val1: val1,
  val2: val2
};</textarea>
    </div>

    <button id="runBtn" style="padding: 12px; background:#E91E63; color:white; border:none; border-radius:5px; cursor:pointer; width: 100%; font-size: 16px; font-weight: bold;">
      🚀 コードを実行して送信
    </button>
    
    <div id="resultArea">
      <h4 style="margin: 0; color: #37474f; text-align: center;">📊 実行・送信結果</h4>
      <div class="result-box">
        <div class="result-col">
          <strong style="color: #555;">入力されたRAW値</strong><br>
          <hr style="border: 0; border-top: 1px dashed #ccc; margin: 5px 0;">
          Val1: <span id="resVal1" style="font-weight:bold; color:#E64A19;">2048</span><br>
          Val2: <span id="resVal2" style="font-weight:bold; color:#E64A19;">2048</span>
        </div>
        <div class="result-col">
          <strong style="color: #555;">実際の角度 (参考)</strong><br>
          <hr style="border: 0; border-top: 1px dashed #ccc; margin: 5px 0;">
          θ1: <span id="resTh1" style="font-weight:bold; color:#1976D2;">0.0</span> °<br>
          θ2: <span id="resTh2" style="font-weight:bold; color:#1976D2;">0.0</span> °
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer">
  <a href="index.html" class="home-button">
    <img src="img/gohome.jpg" alt="Home" class="home-logo">
  </a>
</div>

<!-- CodeMirrorの本体と、JavaScript用の構文解析スクリプトの読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

<script src="js/cont1.js"></script>
</body>
</html>
